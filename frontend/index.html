<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACKPOT PROTOCOL | REAL-TIME</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-blue: #00ffff;
            --bg-color: #050505;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .jackpot-box {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid var(--neon-blue);
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            min-width: 320px;
        }

        .jackpot-label {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .jackpot-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 0;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px var(--neon-blue); }
            50% { transform: scale(1.02); text-shadow: 0 0 30px var(--neon-blue); }
            100% { transform: scale(1); text-shadow: 0 0 20px var(--neon-blue); }
        }

        .action-button {
            background: linear-gradient(45deg, #0055ff, var(--neon-blue));
            color: black;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .action-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        .action-button:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            color: var(--neon-green);
            min-height: 24px;
        }

        .footer-info {
            margin-top: 50px;
            display: flex;
            gap: 40px;
            color: #555;
            font-size: 0.8rem;
        }

        .footer-item h3 {
            color: white;
            margin: 5px 0 0 0;
            font-family: 'Orbitron', sans-serif;
        }
        
        .scanline {
            width: 100%;
            height: 100px;
            z-index: -1;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 255, 255, 0.05) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <header>
        <h1>JACKPOT PROTOCOL</h1>
        <div class="subtitle">Verifiable . On-Chain . Real-Time</div>
    </header>

    <div class="jackpot-box">
        <div class="jackpot-label">LIVE PRIZE POOL (50%)</div>
        <!-- مقدار اولیه در حال بارگذاری -->
        <h2 id="jackpot-amount" class="jackpot-amount">Loading...</h2>
    </div>

    <button id="action-btn" class="action-button">ENTER DRAW</button>
    <div id="status-display" class="status-box">Ready to connect...</div>

    <div class="footer-info">
        <div class="footer-item">
            <p>TICKET PRICE</p>
            <h3>0.0004 ETH</h3>
        </div>
        <div class="footer-item">
            <p>DATA SOURCE</p>
            <h3>BLOCKCHAIN</h3>
        </div>
        <div class="footer-item">
            <p>DRAW TYPE</p>
            <h3 style="color: var(--neon-green);">LIVE STREAM</h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
