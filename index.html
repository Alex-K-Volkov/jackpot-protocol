<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACKPOT PROTOCOL | ETH EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-blue: #00ffff;
            --bg-color: #050505;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- افکت بارش پول --- */
        .money-rain {
            position: fixed;
            top: -50px;
            z-index: -1;
            font-size: 24px;
            animation: fall linear forwards; 
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 10px;
            letter-spacing: 2px;
            z-index: 10;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 10;
        }

        .jackpot-box {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--neon-blue);
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            min-width: 320px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .jackpot-label {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .jackpot-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 0;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px var(--neon-blue); }
            50% { transform: scale(1.02); text-shadow: 0 0 30px var(--neon-blue); }
            100% { transform: scale(1); text-shadow: 0 0 20px var(--neon-blue); }
        }

        .action-button {
            background: linear-gradient(45deg, #0055ff, var(--neon-blue));
            color: black;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            z-index: 10;
        }

        .action-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        .status-box {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            color: var(--neon-green);
            min-height: 24px;
            z-index: 10;
        }

        /* --- استایل راهنمای موبایل (جدید) --- */
        .mobile-hint {
            display: none; /* پیش‌فرض مخفی است */
            color: #FFD700; /* طلایی */
            font-size: 0.8rem;
            margin-top: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #555;
            z-index: 10;
            animation: blink 2s infinite;
        }
        @keyframes blink { 50% { opacity: 0.7; } }
        /* ---------------------------------- */

        .footer-info {
            margin-top: 50px;
            display: flex;
            gap: 40px;
            color: #555;
            font-size: 0.8rem;
            z-index: 10;
        }

        .footer-item h3 {
            color: white;
            margin: 5px 0 0 0;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <h1>JACKPOT PROTOCOL</h1>
        <div class="subtitle">Verifiable . On-Chain . Real-Time</div>
    </header>

    <div class="jackpot-box">
        <div class="jackpot-label">LIVE PRIZE POOL (50%)</div>
        <h2 id="jackpot-amount" class="jackpot-amount">Loading...</h2>
    </div>

    <button id="action-btn" class="action-button">ENTER DRAW</button>
    
    <div id="status-display" class="status-box">Ready to connect...</div>

    <!-- این متن فقط در موبایل ظاهر می‌شود -->
    <div id="mobile-instruction" class="mobile-hint">
        ⚠️ If app opens on 'Wallet', tap the <b>Browser (🧭)</b> icon.
    </div>

    <div class="footer-info">
        <div class="footer-item">
            <p>TICKET PRICE</p>
            <h3>0.0004 ETH</h3>
        </div>
        <div class="footer-item">
            <p>DATA SOURCE</p>
            <h3>BLOCKCHAIN</h3>
        </div>
        <div class="footer-item">
            <p>DRAW TYPE</p>
            <h3 style="color: var(--neon-green);">LIVE STREAM</h3>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        function createMoneyRain() {
            const elements = ['💰', 'Ξ', '💎', '🪙', '💵'];
            const container = document.body;
            const drop = document.createElement('div');
            drop.classList.add('money-rain');
            drop.innerText = elements[Math.floor(Math.random() * elements.length)];
            drop.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 3 + 2;
            drop.style.animationDuration = duration + 's';
            drop.style.fontSize = (Math.random() * 20 + 15) + 'px';
            container.appendChild(drop);
            setTimeout(() => { drop.remove(); }, duration * 1000);
        }
        setInterval(createMoneyRain, 200);
    </script>
</body>
</html>
